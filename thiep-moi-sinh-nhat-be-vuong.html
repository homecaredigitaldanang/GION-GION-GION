  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background: var(--ink);
    color: var(--cream);
    font-family:'Montserrat', sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- BACKDROP ---------- */
  .stage{
    position:relative;
    min-height:100vh;
    width:100%;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(139,108,241,.16), transparent 45%),
      radial-gradient(ellipse at 85% 20%, rgba(212,175,55,.14), transparent 40%),
      radial-gradient(ellipse at 50% 100%, rgba(212,175,55,.10), transparent 55%),
      linear-gradient(180deg, #08080b 0%, #0c0b10 40%, #0a090d 100%);
  }

  .venue-bg{
    position:absolute; inset:0; z-index:0;
    background-image: var(--venue-photo);
    background-position: center 32%;
    background-size: cover;
    background-repeat: no-repeat;
    opacity:.72;
    filter: saturate(1.25) brightness(.95);
  }
  .venue-bg::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(7,7,10,.4) 0%, rgba(7,7,10,.18) 25%, rgba(7,7,10,.55) 70%, rgba(7,7,10,.92) 100%),
      radial-gradient(ellipse at 78% 60%, rgba(7,7,10,0) 0%, rgba(7,7,10,.35) 62%);
  }

  /* twinkling bokeh lights, like venue string lights */
  .bokeh{position:absolute; inset:0; pointer-events:none; z-index:1;}
  .bokeh span{
    position:absolute; border-radius:50%;
    background: radial-gradient(circle, rgba(244,226,161,.9), rgba(244,226,161,0) 70%);
    filter: blur(1px);
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.25; transform:scale(.85);}
    50%{ opacity:1; transform:scale(1.15);}
  }

  /* frame */
  .frame{
    position:absolute; inset:14px;
    border:1px solid var(--line);
    z-index:5;
    pointer-events:none;
  }
  .frame::before,.frame::after{
    content:"";
    position:absolute; width:34px; height:34px;
    border:1px solid var(--gold-2);
  }
  .corner{position:absolute; width:34px; height:34px; z-index:6; pointer-events:none;}
  .corner svg{width:100%; height:100%;}
  .tl{top:14px; left:14px;}
  .tr{top:14px; right:14px; transform:scaleX(-1);}
  .bl{bottom:14px; left:14px; transform:scaleY(-1);}
  .br{bottom:14px; right:14px; transform:scale(-1,-1);}

  /* ---------- CONFETTI ---------- */
  #confetti-canvas{
    position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:40;
  }

  /* ---------- BALLOONS ---------- */
  .balloons{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden;}
  .balloon{
    position:absolute; bottom:-160px;
    width:70px; height:88px;
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    animation-name: float-up;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    opacity:.92;
  }
  .balloon::after{
    content:""; position:absolute; left:50%; bottom:-58px; width:1px; height:58px;
    background: linear-gradient(180deg, rgba(212,175,55,.6), rgba(212,175,55,0));
    transform:translateX(-50%);
  }
  .balloon::before{
    content:""; position:absolute; left:50%; top:100%; width:10px; height:10px;
    background:inherit; transform:translateX(-50%) rotate(45deg); border-radius:2px;
  }
  .b-gold{ background: radial-gradient(circle at 32% 28%, #fff3cf, var(--gold-2) 55%, var(--gold-3) 100%);}
  .b-black{ background: radial-gradient(circle at 32% 28%, #4a4a4f, #17171a 60%, #000 100%);}
  @keyframes float-up{
    0%{ transform: translateY(0) translateX(0) rotate(-3deg); }
    50%{ transform: translateY(-52vh) translateX(18px) rotate(3deg); }
    100%{ transform: translateY(-112vh) translateX(-14px) rotate(-3deg); }
  }

  /* ---------- LAYOUT ---------- */
  .layout{
    position:relative; z-index:10;
    max-width:900px; margin:0 auto;
    padding:0 26px;
  }

  .content{
    padding:56px 0 0;
    text-align:center;
  }

  .person-wrap{
    display:flex; justify-content:center; align-items:flex-end;
    position:relative;
    margin: 6px auto -8px;
    pointer-events:none;
  }
  .person-wrap::before{
    content:"";
    position:absolute;
    left:50%; bottom:6%;
    width:78%; height:38%;
    transform:translateX(-50%);
    background: radial-gradient(ellipse, rgba(212,175,55,.35) 0%, rgba(212,175,55,0) 72%);
    filter: blur(6px);
    z-index:0;
  }
  .person-wrap img{
    position:relative; z-index:1;
    display:block;
    width: clamp(280px, 46vw, 560px);
    height:auto;
    filter: drop-shadow(0 18px 60px rgba(0,0,0,.55)) drop-shadow(0 0 46px rgba(212,175,55,.4));
    opacity:0;
    transform: translateY(30px) scale(.96);
    animation: person-in 1s cubic-bezier(.2,.8,.2,1) forwards 1.05s;
  }
  @keyframes person-in{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .below-person{
    padding:0 0 60px;
    text-align:center;
  }

  @media (max-width: 900px){
    .content{ padding:34px 0 0; }
    .person-wrap img{ width: clamp(240px, 66vw, 380px); }
    .below-person{ padding:0 0 40px; }
  }

  .eyebrow{
    display:inline-block;
    font-size:13px; letter-spacing:6px; font-weight:700;
    color: var(--gold-1);
    opacity:0; animation: reveal .9s ease forwards .2s;
  }

  h1.headline{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size: clamp(46px, 10vw, 92px);
    line-height:0.95;
    letter-spacing:2px;
    margin-top:14px;
    background: linear-gradient(180deg, var(--gold-1) 10%, var(--gold-2) 55%, var(--gold-3) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 0 40px rgba(212,175,55,.25);
    opacity:0; transform: translateY(18px);
    animation: reveal .9s ease forwards .4s;
  }

  h2.script{
    font-family:'Great Vibes', cursive;
    font-size: clamp(58px, 13vw, 130px);
    line-height:1;
    color: var(--cream);
    margin-top:-6px;
    text-shadow: 0 0 26px rgba(246,240,226,.25);
    opacity:0; transform: translateY(18px);
    animation: reveal .9s ease forwards .7s;
  }

  .age-line{
    margin-top:18px;
    font-size: clamp(15px,3vw,20px);
    letter-spacing:5px; font-weight:700; color: var(--cream);
    opacity:0; animation: reveal .9s ease forwards 1s;
  }
  .age-line .num{
    display:inline-block; margin:0 8px; font-family:'Anton', sans-serif;
    font-size: 1.9em; letter-spacing:0;
    color: var(--gold-1);
    animation: pulse-glow 2.4s ease-in-out infinite 1.6s;
  }
  @keyframes pulse-glow{
    0%,100%{ text-shadow: 0 0 12px rgba(244,226,161,.35); transform:scale(1);}
    50%{ text-shadow: 0 0 34px rgba(244,226,161,.9); transform:scale(1.07);}
  }

  .venue{
    margin-top:30px;
    display:inline-flex; align-items:center; gap:10px;
    opacity:0; animation: reveal .9s ease forwards 1.2s;
  }
  .venue .icon{ width:26px; height:26px; color: var(--purple);}
  .venue .brand{ font-family:'Great Vibes', cursive; font-size:26px; color: var(--purple); line-height:1;}
  .venue .name{ font-family:'Anton', sans-serif; font-size:26px; letter-spacing:2px; color: var(--gold-1); margin-left:4px;}
  .venue-stack{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.1;}

  @keyframes reveal{ to{ opacity:1; transform:translateY(0);} }

  /* details card */
  .details{
    margin:44px auto 0;
    max-width:560px;
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 26px;
    display:flex; align-items:center; justify-content:center; gap:26px;
    background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
    opacity:0; animation: reveal .9s ease forwards 1.4s;
    flex-wrap:wrap;
  }
  .details .d-item{ display:flex; align-items:center; gap:12px; text-align:left;}
  .details .d-item svg{ width:28px; height:28px; flex-shrink:0; color:var(--gold-2);}
  .details .d-title{ font-size:17px; font-weight:800; letter-spacing:.5px;}
  .details .d-sub{ font-size:12.5px; letter-spacing:1px; color:#c9c2ac; margin-top:2px;}
  .divider{ width:1px; align-self:stretch; background: var(--line);}

  /* countdown */
  .countdown{
    margin-top:38px;
    display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
    opacity:0; animation: reveal .9s ease forwards 1.6s;
  }
  .cd-box{
    width:78px; padding:12px 0;
    border:1px solid var(--line); border-radius:12px;
    background: rgba(212,175,55,.05);
  }
  .cd-num{ font-family:'Anton', sans-serif; font-size:30px; color:var(--gold-1);}
  .cd-label{ font-size:10px; letter-spacing:2px; color:#c9c2ac; margin-top:4px;}

  .closing{
    margin-top:46px;
    display:flex; align-items:center; justify-content:center; gap:14px;
    opacity:0; animation: reveal .9s ease forwards 1.8s;
  }
  .closing .rule{ width:60px; height:1px; background: var(--line);}
  .closing .heart{ color: var(--gold-2); font-size:16px;}
  .footer-text{
    margin-top:16px; font-size:13px; letter-spacing:3px; font-weight:700;
    color: var(--gold-1);
    opacity:0; animation: reveal .9s ease forwards 2s;
  }

  @media (max-width:520px){
    .details{ flex-direction:column; gap:16px; padding:22px;}
    .divider{ width:80%; height:1px;}
    .cd-box{ width:64px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="venue-bg"></div>
  <div class="bokeh" id="bokeh"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="balloons" id="balloons"></div>

<script>
/* ---- bokeh twinkling lights ---- */
(function(){
  const holder = document.getElementById('bokeh');
  const n = 26;
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    const size = 2 + Math.random()*4;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = (5+Math.random()*70)+'%';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    s.style.animationDuration = (2.5+Math.random()*3)+'s';
    holder.appendChild(s);
  }
})();

/* ---- balloons ---- */
(function(){
  const holder = document.getElementById('balloons');
  const colors = ['b-gold','b-black'];
  const count = 9;
  for(let i=0;i<count;i++){
    const b = document.createElement('div');
    b.className = 'balloon ' + colors[i % 2];
    const left = (i/count)*100 + (Math.random()*6-3);
    b.style.left = left+'%';
    const scale = 0.6 + Math.random()*0.6;
    b.style.transform = `scale(${scale})`;
    b.style.animationDuration = (14 + Math.random()*10)+'s';
    b.style.animationDelay = (Math.random()*-20)+'s';
    holder.appendChild(b);
  }
})();

/* ---- confetti ---- */
(function(){
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let w,h;
  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#d4af37','#f4e2a1','#8b6cf1','#f6f0e2','#a9781f'];
  const pieces = [];
  const total = 90;
  for(let i=0;i<total;i++){
    pieces.push({
      x: Math.random()*w,
      y: Math.random()*-h,
      size: 4 + Math.random()*6,
      speedY: 0.6 + Math.random()*1.6,
      speedX: (Math.random()-0.5)*0.8,
      rot: Math.random()*360,
      rotSpeed: (Math.random()-0.5)*4,
      color: colors[Math.floor(Math.random()*colors.length)],
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(){
    ctx.clearRect(0,0,w,h);
    pieces.forEach(p=>{
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color;
      if(p.shape === 'rect'){
        ctx.fillRect(-p.size/2, -p.size/2*1.6, p.size, p.size*1.6);
      } else {
        ctx.beginPath();
        ctx.arc(0,0,p.size/2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();

      if(!reduceMotion){
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.y*0.01)*0.4;
        p.rot += p.rotSpeed;
        if(p.y > h + 20){
          p.y = -20;
          p.x = Math.random()*w;
        }
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ---- countdown ---- */
(function(){
  const target = new Date('2026-08-28T19:30:00+07:00').getTime();
  const dEl = document.getElementById('cd-days');
  const hEl = document.getElementById('cd-hours');
  const mEl = document.getElementById('cd-mins');
  const sEl = document.getElementById('cd-secs');
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    const now = Date.now();
    let diff = target - now;
    if(diff < 0){
      document.getElementById('countdown').innerHTML =
        '<div style="font-family:Anton,sans-serif;letter-spacing:2px;color:#f4e2a1;font-size:20px;">BỮA TIỆC ĐANG DIỄN RA &#127881;</div>';
      return;
    }
    const days = Math.floor(diff/(1000*60*60*24));
    diff -= days*(1000*60*60*24);
    const hours = Math.floor(diff/(1000*60*60));
    diff -= hours*(1000*60*60);
    const mins = Math.floor(diff/(1000*60));
    diff -= mins*(1000*60);
    const secs = Math.floor(diff/1000);
    dEl.textContent = pad(days);
    hEl.textContent = pad(hours);
    mEl.textContent = pad(mins);
    sEl.textContent = pad(secs);
    requestAnimationFrame(()=>setTimeout(tick, 1000));
  }
  tick();
})();
</script>
</body>
</html>
