<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đi chơi với tớ nhé? ❄️</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fb8;--pink2:#ffd6e7;--blue:#bfe3ff;--blue2:#e8f5ff;--ink:#6b4a63;--white:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--blue2),var(--pink2) 60%,#fff);display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.card{position:relative;z-index:2;width:100%;max-width:440px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border:3px solid var(--white);border-radius:32px;padding:26px 22px;text-align:center;box-shadow:0 12px 40px rgba(255,143,184,.3)}
.step{display:none;animation:pop .5s ease}.step.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.mascot{font-size:68px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
h1{font-size:28px;margin:8px 0 4px;color:#e0508a}
h2{font-size:22px;margin:6px 0 10px;color:#e0508a}
p{margin:6px 0 14px;font-size:17px}
.msg{min-height:48px;color:#d6477f;font-weight:700}
.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:70px}
button{font-family:inherit;font-weight:700;border:0;cursor:pointer;border-radius:999px;transition:transform .15s,box-shadow .15s}
.btn{font-size:18px;padding:12px 26px;color:#fff;background:linear-gradient(135deg,#ff8fb8,#ff6fa3);box-shadow:0 6px 16px rgba(255,111,163,.4)}
.btn:hover{transform:scale(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--blue);color:#3b6a92;box-shadow:0 6px 16px rgba(120,180,230,.35)}
#no{font-size:16px;padding:10px 20px;background:var(--blue);color:#3b6a92;white-space:nowrap;z-index:10}
#yes,#no{transition:transform .25s}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h button{width:38px;height:38px;background:var(--blue);color:#3b6a92;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid span{font-size:13px;color:#9a7a92}
.d{aspect-ratio:1;background:var(--white);color:var(--ink);font-size:15px;border:2px solid var(--blue2);padding:0}
.d:hover:not(:disabled){background:var(--pink2)}
.d:disabled{opacity:.3;cursor:not-allowed}
.d.sel{background:var(--pink);color:#fff;border-color:var(--pink);transform:scale(1.1)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px}
.chip{background:var(--white);color:var(--ink);font-size:17px;padding:14px 8px;border:3px solid var(--blue);border-radius:22px}
.chip.sel{background:var(--pink2);border-color:var(--pink);transform:scale(1.04)}
.sum{background:var(--blue2);border-radius:20px;padding:12px 14px;margin:10px 0 16px;font-size:17px}
#tchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.t{padding:8px 14px;background:var(--white);color:var(--ink);border:2px solid var(--blue);font-size:15px}
.t.sel{background:var(--pink);color:#fff;border-color:var(--pink)}
.tl{display:block;margin:6px 0 14px;font-size:15px}
#tin{font-family:inherit;font-size:16px;padding:6px 10px;border-radius:14px;border:2px solid var(--blue);color:var(--ink)}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
a.btn{display:inline-block;text-decoration:none}
#dogs{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.dg{position:absolute;display:block;width:var(--w,50px)}
.dg,.rd,.ro,.wk,.pet,.pet *{pointer-events:none}
.pet{display:block;line-height:0}
.fl{display:block}
.pet svg{display:block;width:100%;height:auto;overflow:visible}
.lg{animation:swing .32s ease-in-out infinite alternate;animation-play-state:paused}
.pet.run .lg{animation-play-state:running}
.lg.b{animation-delay:-.16s}
.tail{animation:wag .5s ease-in-out infinite alternate}
.pet.run svg{animation:bob .32s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(16deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes runR{from{left:-90px}to{left:calc(100% + 30px)}}
@keyframes runL{from{left:calc(100% + 30px)}to{left:-90px}}
@keyframes walk{from{left:0}to{left:calc(100% - var(--w))}}
@keyframes flip{0%,49.9%{transform:scaleX(1)}50%,100%{transform:scaleX(-1)}}
.wk{position:absolute;left:12px;right:12px;top:-38px;height:40px}
.rd{position:absolute;left:6px;right:6px;bottom:calc(100% - 3px);height:40px}
#yes,#no{position:relative}
#calbox{position:relative}
.ro{position:absolute;left:0;top:0;width:40px;z-index:2;transition:left 1s ease-in-out,top 1s ease-in-out}
#s1 .row{margin-top:46px}
.ft{position:fixed;z-index:11;display:block;pointer-events:none}
small{display:block;margin-top:10px;color:#9a7a92}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="dogs"></div>
<main class="card">

<section class="step on" id="s1">
  <div class="mascot" id="mascot">🐻‍❄️</div>
  <h1>Đi chơi với tớ nhé? ❄️</h1>
  <p>Mùa đông lạnh lắm, đi chơi với tớ cho ấm nha 🧣</p>
  <div class="msg" id="msg"></div>
  <div class="row">
    <button class="btn" id="yes"><span class="tx">Đồng ý 💖</span></button>
    <button id="no"><span class="tx">Không 😤</span></button>
  </div>
</section>

<section class="step" id="sc">
  <div class="mascot">🥰</div>
  <h2>Chắc chắn chưa nè?</h2>
  <p>Đồng ý rồi là phải đi thật đó nha~ 💕</p>
  <div class="row">
    <button class="btn" id="sure">Chắc chắn! 💖</button>
    <button class="btn ghost" id="back1">Quay lại</button>
  </div>
</section>

<section class="step" id="s2">
  <div class="mascot">🗓️</div>
  <h2>Yay! Chọn ngày nào nè?</h2>
  <div class="cal-h"><button id="prev">‹</button><b id="mon"></b><button id="next">›</button></div>
  <div id="calbox"><div class="grid" id="cal"></div></div>
  <p id="dtxt" style="margin:12px 0 0"></p>
  <p style="margin:10px 0 0">⏰ Mấy giờ nè?</p>
  <div id="tchips"></div>
  <label class="tl">hoặc chọn giờ khác: <input type="time" id="tin"></label>
  <button class="btn" id="to3" disabled>Tiếp theo ➜</button>
</section>

<section class="step" id="s3">
  <div class="mascot">🎀</div>
  <h2>Mình đi làm gì nè?</h2>
  <p>Chọn được nhiều món luôn đó~</p>
  <div class="chips" id="chips"></div>
  <button class="btn ghost" id="back2">‹ Quay lại</button>
  <button class="btn" id="to4" disabled>Chốt kèo! ✨</button>
</section>

<section class="step" id="s4">
  <div class="mascot">⛄</div>
  <h2>Hẹn nhau nha! 💕</h2>
  <div class="sum" id="sum"></div>
  <div class="col">
    <a class="btn" id="zalo" href="https://zalo.me/0774443272" target="_blank" rel="noopener">Gửi cho tớ qua Zalo 💙</a>
    <button class="btn ghost" id="copy">Sao chép lời hẹn 📋</button>
    <button class="btn ghost" id="redo">Chọn lại</button>
  </div>
  <small id="ok"></small>
</section>

</main>
<script>
const $=id=>document.getElementById(id);
const show=n=>{document.querySelectorAll('.step').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on')};

/* Snow */
const cv=$('snow'),cx=cv.getContext('2d');let W,H,fl=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
rs();addEventListener('resize',rs);
for(let i=0;i<80;i++)fl.push({x:Math.random()*2000,y:Math.random()*1200,r:1.5+Math.random()*3.5,v:.3+Math.random()*.9,p:Math.random()*6.28,s:.4+Math.random()*.8});
(function tick(){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(255,255,255,.95)';cx.shadowColor='rgba(120,180,230,.7)';cx.shadowBlur=6;
fl.forEach(f=>{f.y+=f.v;f.p+=.015*f.s;f.x+=Math.sin(f.p)*.6;if(f.y>H+10){f.y=-10;f.x=Math.random()*W}if(f.x>W+10)f.x=-10;if(f.x<-10)f.x=W+10;
cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill()});requestAnimationFrame(tick)})();

/* Nút Không: bấm là chó chạy tới tha đi chỗ khác */
const msgs=["Hả? Vừa bấm Không hả? 😳","Vậy suy nghĩ kỹ chưa? 🤔","Thương người đi mà 🥺","Sao mà cố chấp vậy trời! 😤","Đừng mà~ 🥹","Gion ơi… 🥺","Gion ơi ơi ơi huhu 😭"];
const faces=["😳","🤔","🥺","😤","🥹","🥺","😭"];
let n=0,caught=false,busy=false,placed=false;
async function fetchNo(final){
  const b=$('no');busy=true;b.style.pointerEvents='none';
  const bw=b.offsetWidth,bh=b.offsetHeight;
  let r=b.getBoundingClientRect();
  if(!placed){
    document.body.appendChild(b);
    Object.assign(b.style,{position:'fixed',zIndex:10,margin:0,left:(r.left+r.width/2-bw/2)+'px',top:(r.top+r.height/2-bh/2)+'px'});
    placed=true;
  }
  r=b.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2,bsw=r.width,bsh=r.height;
  const W=innerWidth,H=innerHeight,m=14,dw=64,dh=dw*76/104;
  let nx,ny,dir;
  if(final){dir=cx<W/2?-1:1;nx=dir>0?W+bsw/2+10:-bsw/2-10;ny=cy}
  else{
    const lo=m+50+bsh/2,hi=H-m-bsh/2-40;
    for(let i=0;i<8;i++){
      nx=m+bsw/2+Math.random()*Math.max(W-2*m-bsw,10);
      ny=lo+Math.random()*Math.max(hi-lo,10);
      if(Math.abs(nx-cx)>90)break;
    }
    dir=nx>cx?1:-1;
  }
  const fx=dir>0?.88:.12;
  const L=(mx,my)=>[mx-fx*dw,my-.55*dh];
  const gm=dir>0?cx-bsw/2+4:cx+bsw/2-4,dm=dir>0?nx-bsw/2+4:nx+bsw/2-4;
  const grab=L(gm,cy-4),drop=L(dm,ny-4);
  const start=[dir>0?-dw-20:W+20,grab[1]],exit=[dir>0?W+30:-dw-30,drop[1]];
  const dog=document.createElement('span');dog.className='ft';dog.style.width=dw+'px';
  const p=pet('dog',['d1','d2','d3','d4'][n%4],dw,1);
  if(dir<0)p.firstChild.style.transform='scaleX(-1)';
  dog.appendChild(p);document.body.appendChild(dog);
  dog.style.left=start[0]+'px';dog.style.top=start[1]+'px';
  const mv=(a,c,ms,e)=>dog.animate([{left:a[0]+'px',top:a[1]+'px'},{left:c[0]+'px',top:c[1]+'px'}],{duration:ms,easing:e,fill:'forwards'}).finished;
  await mv(start,grab,700,'ease-out');
  let go=true;
  const sync=()=>{
    const d=dog.getBoundingClientRect(),q=b.getBoundingClientRect();
    const mx=d.left+fx*d.width,my=d.top+.55*d.height;
    const ccx=dir>0?mx-4+q.width/2:mx+4-q.width/2;
    b.style.left=(ccx-bw/2)+'px';b.style.top=(my+4-bh/2)+'px';
  };
  (function f(){if(go){sync();requestAnimationFrame(f)}})();
  await mv(grab,drop,1100,'ease-in-out');
  go=false;sync();
  await mv(drop,exit,800,'ease-in');
  dog.remove();b.style.pointerEvents='';busy=false;
}
$('no').onclick=()=>{
  if(busy)return;
  const y=$('yes'),b=$('no');
  if(n<msgs.length){
    $('msg').textContent=msgs[n];$('mascot').textContent=faces[n];n++;
    fetchNo(false);
    b.style.transform='scale('+Math.max(1-n*.06,.65)+')';
    y.style.transform='scale('+Math.min(1+n*.05,1.3)+')';
  }else{
    caught=true;
    $('msg').textContent='Tôi ra lệnh cho chị đi cùng tôi! 😈';
    $('mascot').textContent='😈';
    y.querySelector('.tx').textContent='Được rồi, đồng ý thôi 💖';y.style.transform='scale(1.15)';
    fetchNo(true).then(()=>{b.style.display='none'});
  }
};
$('yes').onclick=()=>show(caught?2:'c');
$('sure').onclick=()=>show(2);
$('back1').onclick=()=>show(1);

/* Calendar */
const today=new Date();today.setHours(0,0,0,0);
let cy=today.getFullYear(),cm=today.getMonth(),pick=null;
const fmt=d=>d.toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'});
function cal(){
  $('mon').textContent='Tháng '+(cm+1)+' / '+cy;
  const g=$('cal');g.innerHTML='';
  ['T2','T3','T4','T5','T6','T7','CN'].forEach(t=>g.insertAdjacentHTML('beforeend','<span>'+t+'</span>'));
  const first=(new Date(cy,cm,1).getDay()+6)%7,days=new Date(cy,cm+1,0).getDate();
  for(let i=0;i<first;i++)g.appendChild(document.createElement('i'));
  for(let d=1;d<=days;d++){
    const dt=new Date(cy,cm,d),b=document.createElement('button');
    b.className='d'+(pick&&+pick==+dt?' sel':'');b.textContent=d;b.disabled=dt<today;
    b.onclick=()=>{pick=dt;$('dtxt').textContent='💗 '+fmt(dt);chk();cal()};
    g.appendChild(b);
  }
}
$('prev').onclick=()=>{if(--cm<0){cm=11;cy--}cal()};
$('next').onclick=()=>{if(++cm>11){cm=0;cy++}cal()};
cal();
let tm='';
const fmtT=t=>t.replace(/^0/,'').replace(':','h');
function chk(){$('to3').disabled=!(pick&&tm)}
function setT(v){tm=v;[...$('tchips').children].forEach(c=>c.classList.toggle('sel',c.dataset.t===v));$('tin').value=v;chk()}
['09:00','10:00','14:00','16:00','18:00','19:30'].forEach(t=>{const b=document.createElement('button');b.className='t';b.dataset.t=t;b.textContent=fmtT(t);b.onclick=()=>setT(t);$('tchips').appendChild(b)});
$('tin').oninput=e=>setT(e.target.value);
$('to3').onclick=()=>show(3);
$('back2').onclick=()=>show(2);

/* Activities */
const acts=[['🎬','Xem phim'],['🍜','Đi ăn'],['🧋','Ăn vặt'],['☕','Cafe'],['🌆','Dạo phố'],['🛕','Đi chùa']];
const chosen=new Set();
acts.forEach(([e,t])=>{
  const b=document.createElement('button');b.className='chip';b.textContent=e+' '+t;
  b.onclick=()=>{chosen.has(t)?chosen.delete(t):chosen.add(t);b.classList.toggle('sel');$('to4').disabled=!chosen.size};
  $('chips').appendChild(b);
});
let text='';
$('to4').onclick=()=>{
  const list=[...chosen].join(', ');
  text='Hẹn nhau nha! 💕 '+fmt(pick)+' lúc '+fmtT(tm)+', mình đi: '+list+' ❄️';
  $('sum').innerHTML='📅 <b>'+fmt(pick)+'</b><br>⏰ <b>'+fmtT(tm)+'</b><br>🎈 '+list;
  $('ok').textContent='';show(4);
};
$('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(text);$('ok').textContent='Đã sao chép! Gửi cho tớ nha 💌'}
  catch(e){$('ok').textContent=text}
};
$('zalo').onclick=()=>{try{navigator.clipboard.writeText(text)}catch(e){};$('ok').textContent='Đã sao chép lời hẹn, dán vào Zalo rồi gửi cho tớ nha 💌'};
$('redo').onclick=()=>show(2);

/* ===== Chó mèo full body ===== */
const PAL={d1:{f:'#f7c97a',e:'#d9984a',b:'#fff3da'},d2:{f:'#f4a259',e:'#d17a30',b:'#ffffff'},d3:{f:'#b98a62',e:'#7d5636',b:'#f1dcc2'},d4:{f:'#ffffff',e:'#ffd2e1',b:'#fff4f8'},c1:{f:'#ffb86b',e:'#ff9440',b:'#fff0dd'},c2:{f:'#c3cad6',e:'#9aa3b3',b:'#f4f6fa'},c3:{f:'#8f88a6',e:'#6f6888',b:'#d9d5e6'},c4:{f:'#fff6ea',e:'#ffd9b8',b:'#ffffff'}};
function svg(k,p){
  const S='stroke="#6b4a63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"';
  const dog=k==='dog';
  const leg=(x,c)=>`<g class="lg ${c}" style="transform-origin:${x+4}px 54px"><rect x="${x}" y="52" width="8" height="22" rx="4" fill="${p.f}" ${S}/><ellipse cx="${x+4}" cy="71.5" rx="5.5" ry="3.3" fill="${p.b}" ${S}/></g>`;
  const tail=dog?'M22 45 Q8 42 10 27':'M22 47 Q3 48 5 26 Q6 14 15 15';
  let h='<svg viewBox="0 0 104 76" xmlns="http://www.w3.org/2000/svg">';
  h+=`<g class="tail" style="transform-origin:24px 46px"><path d="${tail}" fill="none" stroke="#6b4a63" stroke-width="9" stroke-linecap="round"/><path d="${tail}" fill="none" stroke="${p.f}" stroke-width="5.2" stroke-linecap="round"/></g>`;
  h+=leg(26,'a')+leg(36,'b')+leg(56,'b')+leg(66,'a');
  h+=`<ellipse cx="48" cy="46" rx="28" ry="17" fill="${p.f}" ${S}/><ellipse cx="48" cy="54" rx="17" ry="7.5" fill="${p.b}" opacity=".85"/>`;
  if(!dog)h+=`<path d="M59 25 L60 5 L75 16 Z" fill="${p.f}" ${S}/><path d="M93 25 L92 5 L77 16 Z" fill="${p.f}" ${S}/><path d="M63 20 L63.5 11 L70 16 Z" fill="#ffb3c9"/><path d="M89 20 L88.5 11 L82 16 Z" fill="#ffb3c9"/>`;
  h+=`<circle cx="76" cy="32" r="18" fill="${p.f}" ${S}/><ellipse cx="77" cy="41" rx="9.5" ry="6.5" fill="${p.b}"/>`;
  if(dog)h+=`<ellipse cx="61" cy="29" rx="6.5" ry="12" transform="rotate(18 61 29)" fill="${p.e}" ${S}/><ellipse cx="91" cy="29" rx="6.5" ry="12" transform="rotate(-18 91 29)" fill="${p.e}" ${S}/>`;
  h+='<circle cx="69" cy="31" r="3.4" fill="#3a2a35"/><circle cx="85" cy="31" r="3.4" fill="#3a2a35"/><circle cx="70.1" cy="29.8" r="1.2" fill="#fff"/><circle cx="86.1" cy="29.8" r="1.2" fill="#fff"/>';
  h+='<ellipse cx="63.5" cy="38.5" rx="4" ry="2.4" fill="#ff9fbf" opacity=".75"/><ellipse cx="89.5" cy="38.5" rx="4" ry="2.4" fill="#ff9fbf" opacity=".75"/>';
  h+=dog?'<ellipse cx="77" cy="37" rx="3.4" ry="2.4" fill="#3a2a35"/>':'<path d="M74.8 36 h4.4 l-2.2 2.8z" fill="#ff7fa6"/>';
  h+='<path d="M72.5 41 q2.2 3 4.5 0 q2.3 3 4.5 0" fill="none" stroke="#3a2a35" stroke-width="1.4" stroke-linecap="round"/>';
  h+=dog?'<path d="M75 43.2 q2 7 4 0z" fill="#ff7b9c" stroke="#6b4a63" stroke-width="1"/>':'<g stroke="#6b4a63" stroke-width="1.1" opacity=".6" stroke-linecap="round"><path d="M62 39 L52 37M62 42 L52 43M91 39 L101 37M91 42 L101 43"/></g>';
  h+=`<path d="M63 46 Q77 58 91 46" fill="none" stroke="${dog?'#ff6f8f':'#6fb7ff'}" stroke-width="3.6" stroke-linecap="round"/><circle cx="77" cy="53" r="3" fill="#ffd54a" stroke="#6b4a63" stroke-width="1.2"/>`;
  return h+'</svg>';
}
/*END-SVG*/
function pet(k,v,w,run){
  const e=document.createElement('span');e.className='pet'+(run?' run':'');e.style.width=w+'px';
  e.innerHTML='<span class="fl">'+svg(k,PAL[v])+'</span>';return e;
}
function walker(par,k,v,w,dur,del){
  const d=document.createElement('span');d.className='dg';d.style.setProperty('--w',w+'px');d.style.bottom='0';
  d.style.animation='walk '+dur+'s linear '+del+'s infinite alternate';
  const p=pet(k,v,w,1);p.firstChild.style.animation='flip '+dur*2+'s linear '+del+'s infinite';
  d.appendChild(p);par.appendChild(d);
}
function runner(k,v,w,dir,dur,del,bottom){
  const d=document.createElement('span');d.className='dg';d.style.setProperty('--w',w+'px');d.style.bottom=bottom+'px';
  d.style.animation=(dir>0?'runR ':'runL ')+dur+'s linear '+del+'s infinite';
  const p=pet(k,v,w,1);if(dir<0)p.firstChild.style.transform='scaleX(-1)';
  d.appendChild(p);$('dogs').appendChild(d);
}
function rider(btn,k,v,w,dur,del){
  const r=document.createElement('span');r.className='rd';btn.appendChild(r);walker(r,k,v,w,dur,del);
}
/* chạy dọc đáy màn hình */
runner('dog','d1',66,1,15,0,4);
runner('cat','c1',60,-1,19,-6,18);
runner('dog','d2',58,1,24,-12,32);
runner('cat','c2',56,1,27,-18,10);
runner('dog','d3',60,-1,21,-9,26);
runner('cat','c4',54,-1,31,-22,14);
/* đi trên mép khung */
const wk=document.createElement('span');wk.className='wk';document.querySelector('.card').appendChild(wk);
walker(wk,'dog','d2',52,10,0);
walker(wk,'cat','c4',48,14,-5);
/* trèo lên nút Đồng ý / Không */
rider($('yes'),'cat','c1',46,6,0);
rider($('yes'),'dog','d3',42,8,-3);
rider($('no'),'dog','d4',42,5,-1);
/* chạy nhảy trên lịch */
function roamer(k,v,off){
  const d=document.createElement('span');d.className='ro';const p=pet(k,v,40,0);d.appendChild(p);$('calbox').appendChild(d);
  let x=0;
  function go(){
    const g=$('cal');if(!g.offsetParent)return;
    const cs=[...g.querySelectorAll('.d')];if(!cs.length)return;
    const c=cs[Math.floor(Math.random()*cs.length)];
    const nx=c.offsetLeft+c.offsetWidth/2-20,ny=c.offsetTop+c.offsetHeight-30;
    p.firstChild.style.transform=nx<x?'scaleX(-1)':'';x=nx;
    p.classList.add('run');d.style.left=nx+'px';d.style.top=ny+'px';
    setTimeout(()=>p.classList.remove('run'),1000);
  }
  setTimeout(()=>{go();setInterval(go,2200)},off);
}
roamer('dog','d3',300);roamer('cat','c3',1400);roamer('dog','d1',2300);
</script>
